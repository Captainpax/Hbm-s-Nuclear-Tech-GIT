plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

def modId = 'hbm'
def mcVersion = '1.20.1'
def forgeVersion = '47.4.10'
def portVersion = '1.20.1-0.1.0-dev'

version = portVersion
group = 'com.hbm'

base {
    archivesName = modId
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// The original 1.7.10 code remains in src/main for the parity audit. Only
// src/forge120 is compiled and packaged by this branch.
sourceSets {
    main {
        java { srcDirs = ['src/forge120/java'] }
        resources { srcDirs = ['src/forge120/resources', 'src/generated/resources'] }
    }
}

minecraft {
    mappings channel: 'official', version: mcVersion
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                hbm { source sourceSets.main }
            }
        }
        client {
            property 'hbm.port.auditSocketModels', 'true'
            if (project.hasProperty('hbmClientDriver')) {
                property 'hbm.port.clientDriver', project.property('hbmClientDriver').toString()
                args '--quickPlayMultiplayer', '127.0.0.1:25566'
            }
        }
        clientSmoke {
            parent runs.client
            workingDirectory project.file('run-client-smoke')
            property 'hbm.port.clientSmoke', 'true'
        }
        server {
            args '--nogui'
            if (project.hasProperty('hbmMultiplayer')) {
                workingDirectory project.file('run-multiplayer')
            }
        }
        multiplayerClient {
            parent runs.client
            workingDirectory project.file('run-multiplayer-client')
            jvmArgs '-Xmx2G'
            args '--username', 'HbmObserver'
            if (project.hasProperty('hbmAutoJoin') && !project.hasProperty('hbmClientDriver')) {
                args '--quickPlayMultiplayer', '127.0.0.1:25566'
            }
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', modId
            if (project.hasProperty('hbmMultiplayer')) {
                workingDirectory project.file('run-multiplayer-tests')
            }
            def persistencePhase = project.findProperty('hbmPersistencePhase')
            if (persistencePhase != null) {
                property 'hbm.port.persistence.phase', persistencePhase.toString()
            }
        }
        oreConfigGameTestServer {
            parent runs.gameTestServer
            workingDirectory project.file('run-ore-config')
            property 'forge.enabledGameTestNamespaces', modId
            def oreConfigPhase = project.findProperty('hbmOreConfigPhase')
            if (oreConfigPhase != null) {
                property 'hbm.port.ore.config.phase', oreConfigPhase.toString()
            }
        }
        gneissSeedGameTestServer {
            parent runs.gameTestServer
            workingDirectory project.file('run-gneiss-seed')
            property 'forge.enabledGameTestNamespaces', modId
        }
        taggedInputGameTestServer {
            parent runs.gameTestServer
            workingDirectory project.file('run-tagged-inputs')
            property 'forge.enabledGameTestNamespaces', modId
            property 'hbm.port.taggedInputs', 'true'
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', modId, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/forge120/resources/')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mcVersion}-${forgeVersion}"
}

tasks.named('processResources', ProcessResources).configure {
    def values = [
        minecraft_version: mcVersion,
        minecraft_version_range: '[1.20.1,1.20.2)',
        forge_version_range: '[47.4.10,48)',
        loader_version_range: '[47,)',
        mod_id: modId,
        mod_name: "Hbm's Nuclear Tech Mod",
        mod_license: 'GPL-3.0-only',
        mod_version: portVersion,
        mod_authors: 'HbMinecraft and contributors',
        mod_description: 'HBM Nuclear Tech port for Minecraft 1.20.1. Development build; feature parity is in progress.',
    ]
    inputs.properties values
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand values
    }
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}

// Alternate item identities belong only to this isolated regression world.
tasks.register('prepareTaggedInputFixture') {
    def pack = file('run-tagged-inputs/world/datapacks/hbm-tagged-inputs')
    def properties = file('run-tagged-inputs/server.properties')
    inputs.dir 'tools/porting/fixtures/tagged-inputs'
    outputs.dir pack
    outputs.file properties
    doLast {
        copy {
            from 'tools/porting/fixtures/tagged-inputs'
            into pack
        }
        if (!properties.exists()) properties.setText('level-name=world\n', 'UTF-8')
    }
}
tasks.matching { it.name == 'runTaggedInputGameTestServer' }.configureEach {
    dependsOn 'prepareTaggedInputFixture'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
