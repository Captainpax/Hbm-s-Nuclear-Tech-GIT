name: Forge 1.20.1 port checks

on:
  push:
    branches: [captainpax/forge-1.20.1]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  client-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Launch client and validate socket OBJ layers
        run: xvfb-run -a ./gradlew runClientSmoke --no-daemon --console=plain

  build-and-gametest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Verify parity inventory
        run: |
          python tools/porting/build_inventory.py --check
          python tools/porting/test_inventory.py
      - name: Build and seed dedicated persistence GameTest
        run: ./gradlew build runGameTestServer -PhbmPersistencePhase=seed --no-daemon --console=plain
      - name: Restart dedicated server and verify radiation battery cable socket and charged pack state
        run: ./gradlew runGameTestServer -PhbmPersistencePhase=verify --no-daemon --console=plain
      - name: Test master-disabled ore generation in fresh chunks
        run: |
          mkdir -p run-ore-config/world/serverconfig
          cp tools/porting/fixtures/hbm-server-master-off.toml run-ore-config/world/serverconfig/hbm-server.toml
          ./gradlew runOreConfigGameTestServer -PhbmOreConfigPhase=master-off --no-daemon --console=plain
      - name: Test copper-disabled generation with other ores enabled
        run: |
          cp tools/porting/fixtures/hbm-server-copper-off.toml run-ore-config/world/serverconfig/hbm-server.toml
          ./gradlew runOreConfigGameTestServer -PhbmOreConfigPhase=copper-off --no-daemon --console=plain
      - name: Test non-default positive copper generation in fresh chunks
        run: |
          cp tools/porting/fixtures/hbm-server-copper-high.toml run-ore-config/world/serverconfig/hbm-server.toml
          ./gradlew runOreConfigGameTestServer -PhbmOreConfigPhase=copper-high --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: hbm-forge-1.20.1-dev
          path: build/libs/*.jar
          if-no-files-found: error
