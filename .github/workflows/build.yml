name: Forge 1.20.1 port checks

on:
  push:
    branches: [captainpax/forge-1.20.1]
  pull_request:
    branches: [captainpax/forge-1.20.1]
  workflow_dispatch:

jobs:
  build-and-gametest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Verify parity inventory
        run: python tools/porting/build_inventory.py --check
      - name: Build and run dedicated GameTests
        run: ./gradlew build runGameTestServer --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: hbm-forge-1.20.1-dev
          path: build/libs/*.jar
          if-no-files-found: error
