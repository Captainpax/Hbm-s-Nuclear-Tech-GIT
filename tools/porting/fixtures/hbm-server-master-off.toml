
[radiation]
	#Toggles radiation contamination; legacy negative effects are still being ported.
	RADIATION_00_enableContamination = true
	#Enable persistent chunk radiation in the default scalar system.
	RADIATION_01_enableChunkRads = true
	#Ambient Nether radiation in RAD per second.
	#Range: 0.0 ~ 100000.0
	AMBIENT_00_nether = 0.1

[hazards]
	#Disable asbestos hazards.
	HAZ_00_disableAsbestos = false

